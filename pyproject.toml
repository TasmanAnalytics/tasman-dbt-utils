# yaml-language-server: $schema=https://json.schemastore.org/pyproject.json

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"

[project]
name = "tasman-dbt-utils"
version = "1.2.2"
description = "Package with useful utility features."
authors = [
    {name = "Tasman Analytics"},
]
requires-python = ">=3.12"
readme = "README.md"

[dependency-groups]
dbt = [
    "dbt-snowflake>=1.8.0,<2",
    "dbt-bigquery>=1.8.0,<2",
]
dev = [
    "sqlfluff>=2.3.0,<3",
    "sqlfluff-templater-dbt>=2.3.0,<3",
]

[tool.uv]
default-groups = [
    "dbt",
    "dev",
]
package = false

[tool.uv.build-backend]
namespace = true
